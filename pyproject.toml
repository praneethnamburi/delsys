[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "delsys"
version = "0.1.0"
description = "Load and process Delsys EMG system CSV exports (EMGworks, Trigno Discover) in Python."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Praneeth Namburi", email = "praneeth.namburi@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "heartpy",
    "neurokit2",
    "pysampled>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "black",
    "isort",
]

[project.urls]
Homepage = "https://github.com/praneethnamburi/delsys"
Issues = "https://github.com/praneethnamburi/delsys/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["delsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Upstream noise from heartpy / matplotlib / sklearn / etc — keep our test output readable.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
