[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "delsys"
authors = [{ name = "Praneeth Namburi", email = "praneeth.namburi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dynamic = ["version", "description"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "heartpy",
    "neurokit2",
    "pysampled>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "black",
    "isort",
]

[project.urls]
Homepage = "https://github.com/praneethnamburi/delsys"
Documentation = "https://delsys.readthedocs.io"
Issues = "https://github.com/praneethnamburi/delsys/issues"

# Tell flit the package lives under src/ rather than at repo root.
[tool.flit.module]
name = "delsys"

[tool.flit.sdist]
include = ["CHANGELOG.md", "examples/", "tests/"]
exclude = [
    "tests/fixtures/*_dropped_samples.txt",
    "tests/fixtures/*_ekginfo.json",
    "tests/fixtures/*_ica_settings.json",
]

[tool.coverage.run]
source = ["delsys"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["delsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Upstream noise from heartpy / matplotlib / sklearn / etc — keep our test output readable.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
